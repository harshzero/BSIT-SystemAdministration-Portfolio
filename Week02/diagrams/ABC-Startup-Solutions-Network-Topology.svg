  <rect x="680" y="300" width="240" height="74" class="box edge"/><text x="800" y="332" class="label">ISP Modem / ONT</text><text x="800" y="356" class="small">Business Fibre • 300 Mbps+</text>
  <line x1="800" y1="374" x2="800" y2="426" class="line" marker-end="url(#arrow)"/>
  <rect x="650" y="428" width="300" height="88" class="box edge"/><text x="800" y="464" class="label">Next-Generation Firewall / Router</text><text x="800" y="490" class="small">NAT • VPN • IPS • VLAN gateway • ACLs</text>
