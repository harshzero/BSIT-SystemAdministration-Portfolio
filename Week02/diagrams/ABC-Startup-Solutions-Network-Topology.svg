  <rect x="260" y="930" width="1080" height="72" class="legend"/><text x="290" y="960" class="note">Security baseline:</text><text x="290" y="984" class="note">Default-deny inter-VLAN rules • MFA for privileged/remote access • managed endpoint protection • encrypted, tested 3-2-1 backups</text>
