  <rect x="310" y="772" width="220" height="105" class="box dept"/><text x="420" y="812" class="label">HR Department</text><text x="420" y="838" class="small">4 users • VLAN 20</text><text x="420" y="860" class="small">10.20.20.0/24</text>
