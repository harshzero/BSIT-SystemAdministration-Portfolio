<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1050" viewBox="0 0 1600 1050" role="img" aria-labelledby="title desc">
  <title id="title">ABC Startup Solutions Enterprise Network Topology</title>
  <desc id="desc">Internet connects to an ISP modem, firewall router, managed switch, two wireless access points, a server, NAS, printer, and four department networks.</desc>
  <defs>
    <style>
      .bg{fill:#f7f9fc}.title{font:700 34px Arial,sans-serif;fill:#12233f}.sub{font:16px Arial,sans-serif;fill:#526275}.label{font:700 17px Arial,sans-serif;fill:#fff;text-anchor:middle}.small{font:14px Arial,sans-serif;fill:#fff;text-anchor:middle}.caption{font:600 15px Arial,sans-serif;fill:#203853;text-anchor:middle}.note{font:14px Arial,sans-serif;fill:#526275}.line{stroke:#506d8d;stroke-width:4;fill:none}.dash{stroke:#7188a2;stroke-width:3;stroke-dasharray:8 7;fill:none}.box{rx:16;ry:16;stroke-width:2}.cloud{fill:#e7f0ff;stroke:#4d78b7}.edge{fill:#275d96;stroke:#163e69}.core{fill:#146c94;stroke:#0d4560}.service{fill:#6d4c9a;stroke:#452d67}.dept{fill:#36866f;stroke:#245746}.wifi{fill:#cc7a26;stroke:#8a4b0e}.legend{fill:#fff;stroke:#c8d3e1;stroke-width:2}
    </style>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M0,0 L12,6 L0,12 z" fill="#506d8d"/></marker>
  </defs>
  <rect class="bg" width="1600" height="1050"/>
  <text x="800" y="55" class="title" text-anchor="middle">ABC Startup Solutions – Enterprise Network Topology</text>
  <text x="800" y="82" class="sub" text-anchor="middle">Prepared by: Harry Martillano | ITEP 414 – System Administration and Maintenance</text>
  <path d="M800 130c-55 0-86 31-86 65 0 28 21 49 48 53h76c36 0 62-24 62-55 0-35-31-63-69-63-7 0-20 0-31 0z" class="box cloud"/>
  <text x="800" y="183" class="caption">Internet</text>
